---
# Routing table: site_id → service_category → service_operation → AAP Job Template name
# Add new routes here to extend the decision engine without changing the playbook logic.
jt_routing_table:
  site-north:
    web-app:
      start: "AppDeploy - Deploy Web Frontend"
      stop: "AppDeploy - Restart Web Service"
  site-south:
    data-pipeline:
      start: "DataOps - Run Pipeline Backup"
      stop: "DataOps - Restore Pipeline"
