---
# Decision Engine: maps survey inputs to target job template name.
# Passes result to subsequent workflow nodes via set_stats.
- name: Route Request to Target Job Template
  hosts: localhost
  gather_facts: false
  vars_files:
    - routing_table.yml
  tasks:
    - name: Validate required survey variables are present
      ansible.builtin.fail:
        msg: "Missing required variable: {{ item }}"
      loop:
        - site_id
        - service_category
        - service_operation
      when: vars[item] is not defined or vars[item] == ''

    - name: Look up target job template from routing table
      ansible.builtin.set_fact:
        target_jt_name: >-
          {{ jt_routing_table
             | dict2items
             | selectattr('key', 'equalto', site_id)
             | map(attribute='value')
             | first
             | default({})
             | dict2items
             | selectattr('key', 'equalto', service_category)
             | map(attribute='value')
             | first
             | default({})
             | dict2items
             | selectattr('key', 'equalto', service_operation)
             | map(attribute='value')
             | first
             | default('') }}

    - name: Fail if no matching route found in routing table
      ansible.builtin.fail:
        msg: >-
          No job template found for:
            site_id         = {{ site_id }}
            service_category = {{ service_category }}
            service_operation = {{ service_operation }}
          Check routing_table.yml for valid combinations.
      when: target_jt_name == ''

    - name: Approval summary — approver open this node output before deciding
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  REVIEW BEFORE APPROVING — Job Template to Execute"
          - "======================================================"
          - "Requested by    : {{ awx_user_name | default('unknown') }}"
          - "Email           : {{ awx_user_email | default('N/A') }}"
          - "Change ticket   : {{ change_request_id | default('Not provided') }}"
          - "------------------------------------------------------"
          - "Site            : {{ site_id }}"
          - "Service         : {{ service_category }}"
          - "Operation       : {{ service_operation }}"
          - "------------------------------------------------------"
          - ">>> JOB TEMPLATE : {{ target_jt_name }} <<<"
          - "======================================================"

    - name: Expose decision result and approval context to workflow
      ansible.builtin.set_stats:
        data:
          target_jt_name: "{{ target_jt_name }}"
          approval_requested_by: "{{ awx_user_name | default('unknown') }}"
          approval_requester_email: "{{ awx_user_email | default('N/A') }}"
          approval_change_ticket: "{{ change_request_id | default('Not provided') }}"
          approval_site: "{{ site_id }}"
          approval_service: "{{ service_category }}"
          approval_operation: "{{ service_operation }}"
          approval_job_template: "{{ target_jt_name }}"
          approval_workflow_job: "{{ awx_workflow_job_id | default('N/A') }}"
