---
# Launches a target AAP job template by name via REST API, then polls until completion.
# Requires env vars CONTROLLER_HOST and CONTROLLER_TOKEN injected by AAP API Token credential.
# Resolves target JT name independently from routing_table.yml using the same survey vars
# passed by the workflow — does not depend on set_stats from the decision node.
- name: Launch and Track Target Job Template via API
  hosts: localhost
  gather_facts: false
  vars_files:
    - routing_table.yml
  vars:
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') | regex_replace('/$', '') }}"
    controller_token: "{{ lookup('env', 'CONTROLLER_TOKEN') }}"
    # AAP 2.5+ uses /api/controller/v2 — override to /api/v2 for standalone controller (AAP 2.4)
    controller_api: "{{ lookup('env', 'CONTROLLER_HOST') | regex_replace('/$', '') }}/api/controller/v2"
    api_headers:
      Authorization: "Bearer {{ controller_token }}"
      Content-Type: "application/json"
    poll_delay: 10
    poll_retries: 80
  tasks:
    - name: Validate required survey variables are present
      ansible.builtin.fail:
        msg: "Missing required survey variable: {{ item }}"
      loop:
        - site_id
        - service_category
        - service_operation
      when: vars[item] is not defined or vars[item] == ''

    - name: Resolve target job template from routing table
      ansible.builtin.set_fact:
        target_jt_name: >-
          {{ jt_routing_table
             | dict2items
             | selectattr('key', 'equalto', site_id)
             | map(attribute='value')
             | first
             | default({})
             | dict2items
             | selectattr('key', 'equalto', service_category)
             | map(attribute='value')
             | first
             | default({})
             | dict2items
             | selectattr('key', 'equalto', service_operation)
             | map(attribute='value')
             | first
             | default('') }}

    - name: Fail if no route found for the given survey inputs
      ansible.builtin.fail:
        msg: >-
          No job template found for:
            site_id          = {{ site_id }}
            service_category = {{ service_category }}
            service_operation = {{ service_operation }}
          Check routing_table.yml for valid combinations.
      when: target_jt_name == ''

    - name: Print launch summary before executing
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "  Launching Job Template"
          - "======================================================"
          - "Requested by     : {{ awx_user_name | default('unknown') }}"
          - "Change ticket    : {{ change_request_id | default('Not provided') }}"
          - "------------------------------------------------------"
          - "Site             : {{ site_id }}"
          - "Service          : {{ service_category }}"
          - "Operation        : {{ service_operation }}"
          - "------------------------------------------------------"
          - ">>> JOB TEMPLATE : {{ target_jt_name }} <<<"
          - "======================================================"

    - name: Search for job template by name
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/?name={{ target_jt_name | replace(' ', '%20') }}"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: false
        return_content: true
      register: jt_search
      failed_when:
        - jt_search.status != 200

    - name: Fail if job template not found
      ansible.builtin.fail:
        msg: "Job template '{{ target_jt_name }}' not found in AAP. Verify it exists and is accessible."
      when: jt_search.json.count == 0

    - name: Extract job template ID
      ansible.builtin.set_fact:
        target_jt_id: "{{ jt_search.json.results[0].id }}"

    - name: Build launch payload
      ansible.builtin.set_fact:
        launch_payload:
          extra_vars:
            service_operation: "{{ service_operation }}"
            service_category: "{{ service_category }}"
            site_id: "{{ site_id | default('') }}"

    - name: Launch the job template
      ansible.builtin.uri:
        url: "{{ controller_api }}/job_templates/{{ target_jt_id }}/launch/"
        method: POST
        headers: "{{ api_headers }}"
        body: "{{ launch_payload | to_json }}"
        body_format: json
        validate_certs: false
        status_code: 201
      register: launch_response

    - name: Extract launched job ID
      ansible.builtin.set_fact:
        launched_job_id: "{{ launch_response.json.id }}"

    - name: Print job URL for operator
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "Job launched successfully!"
          - "Job Template : {{ target_jt_name }}"
          - "Job ID       : {{ launched_job_id }}"
          - "{{ controller_host }}/execution/jobs/playbook/{{ launched_job_id }}/output"
          - "========================================"
          - "Polling for completion every {{ poll_delay }}s (max {{ poll_retries }} attempts)..."

    - name: Poll job status until completion
      ansible.builtin.uri:
        url: "{{ controller_api }}/jobs/{{ launched_job_id }}/"
        method: GET
        headers: "{{ api_headers }}"
        validate_certs: false
      register: job_poll
      until: job_poll.json.status in ['successful', 'failed', 'error', 'canceled']
      retries: "{{ poll_retries }}"
      delay: "{{ poll_delay }}"

    - name: Print final job result
      ansible.builtin.debug:
        msg:
          - "========================================"
          - "Job {{ launched_job_id }} completed with status: {{ job_poll.json.status | upper }}"
          - "View output (click to open):"
          - "{{ controller_host }}/execution/jobs/playbook/{{ launched_job_id }}/output"
          - "========================================"

    - name: Fail playbook if launched job did not succeed
      ansible.builtin.fail:
        msg: >-
          Job {{ launched_job_id }} ended with status '{{ job_poll.json.status }}'.
          Review: {{ controller_host }}/#/jobs/playbook/{{ launched_job_id }}/output
      when: job_poll.json.status != 'successful'
